<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Seno — Анализ монеты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script src="locales.js?v=c99b80b4"></script>
<script src="shared.js?v=2a001283"></script>
<style>
  :root {
    --bg: #000000; --surface: #0B0B0E; --surface-raised: #131318; --border: #1E1E24;
    --text-primary: #F2F4F7; --text-secondary: #8A8F9C; --text-tertiary: #5A5F6B;
    --accent: #00E5C7; --up: #1FCF6C; --down: #F6465D;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Roboto, sans-serif;
    --font-mono: "SF Mono", "SFMono-Regular", Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text-primary); font-family: var(--font); }
  body { display: flex; justify-content: center; }

  .app-shell { width: 100%; max-width: 420px; min-height: 100vh; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); position: relative; }

  .coin-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; gap: 10px; }
  .coin-pick { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .coin-pair { font-size: 15px; color: var(--text-primary); margin: 0; font-weight: 700; }
  .coin-pick svg { width: 14px; height: 14px; }
  .coin-price { font-family: var(--font-mono); font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .coin-change { display: inline-block; margin-left: 8px; font-size: 13px; font-weight: 700; vertical-align: middle; }
  .coin-change.up { color: var(--up); } .coin-change.down { color: var(--down); }

  .tf-pills { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; max-width: 160px; }
  .tf-pill { font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; padding: 6px 9px; border-radius: 9px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text-secondary); cursor: pointer; }
  .tf-pill.active { background: var(--accent); color: #04342C; border-color: var(--accent); }

  .verdict-card { border-radius: 18px; padding: 16px 18px; margin-bottom: 14px; background: var(--surface);
    border: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; min-height: 62px; }
  .verdict-card.buy { border-color: var(--up); box-shadow: 0 0 24px rgba(31,207,108,0.16); }
  .verdict-card.sell { border-color: var(--down); box-shadow: 0 0 24px rgba(246,70,93,0.16); }
  .verdict-left { display: flex; align-items: center; gap: 10px; }
  .verdict-left svg { width: 26px; height: 26px; }
  .verdict-dir { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
  .verdict-dir.buy { color: var(--up); } .verdict-dir.sell { color: var(--down); } .verdict-dir.wait { color: var(--text-secondary); }
  .verdict-sub { font-size: 11.5px; color: var(--text-secondary); margin: 2px 0 0; }
  .verdict-conf { text-align: right; }
  .verdict-conf .num { font-family: var(--font-mono); font-size: 22px; font-weight: 700; }
  .verdict-conf .lbl { font-size: 10.5px; color: var(--text-secondary); margin-top: 1px; }

  .chart-wrap { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 8px; height: 320px; }
  #chart-container { width: 100%; height: 100%; }
  .watermark { position: absolute; left: 10px; bottom: 10px; opacity: 0.15; width: 26px; height: 26px; pointer-events: none; z-index: 2; }
  .chart-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-tertiary); font-size: 12.5px; text-align: center; padding: 0 24px; }
  .chart-hint { text-align: center; font-size: 10.5px; color: var(--text-tertiary); margin: 0 0 6px; }
  .corr-line { text-align: center; font-size: 11px; color: var(--text-secondary); margin: 0 0 14px; }
  .corr-line b { font-family: var(--font-mono); color: var(--text-primary); }

  .ind-tabs { display: flex; gap: 6px; margin: 8px 0 8px; }
  .ind-tabs button { flex: 1; border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary);
    font-family: var(--font); font-size: 11.5px; font-weight: 700; padding: 7px 0; border-radius: 9px; }
  .ind-tabs button.active { background: var(--accent); color: #04342C; border-color: var(--accent); }
  .ind-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; height: 130px; margin-bottom: 8px; }
  #ind-container { width: 100%; height: 100%; }

  .params-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 4px 16px; margin-bottom: 14px; }
  .param-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .param-row:last-child { border-bottom: none; }
  .param-label { font-size: 13px; color: var(--text-secondary); }
  .param-value { font-family: var(--font-mono); font-size: 14px; font-weight: 700; text-align: right; }
  .param-value .pct { font-size: 11.5px; font-weight: 700; margin-left: 6px; }
  .param-value.down { color: var(--down); } .param-value.up { color: var(--up); } .param-value.accent { color: var(--accent); }
  .pct.down { color: var(--down); } .pct.up { color: var(--up); }

  .reasons-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; }
  .reasons-title { font-size: 11px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-tertiary); margin: 0 0 10px; }
  .reason-row { display: flex; align-items: flex-start; gap: 9px; padding: 6px 0; }
  .reason-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; background: var(--text-tertiary); }
  .reason-text { font-size: 13px; color: var(--text-primary); line-height: 1.4; }
  .factors-link { display: block; text-align: right; font-size: 12.5px; font-weight: 700; color: var(--accent); text-decoration: none; margin-top: 6px; }
  .factors-link:active { opacity: 0.7; }

  .disclaimer { font-size: 11px; line-height: 1.5; color: var(--text-tertiary); text-align: center; padding: 0 6px; margin-bottom: 100px; }

  .lock-card { text-align: center; padding: 26px 18px; margin-bottom: 100px; background: var(--surface); border: 1px solid var(--accent); border-radius: 16px; }
  .lock-card p { font-size: 12.5px; color: var(--text-secondary); margin: 0 0 14px; line-height: 1.4; }
  .lock-btn { font-size: 13.5px; font-weight: 700; color: #04342C; background: var(--accent); border: none; padding: 11px 20px; border-radius: 12px; }

  .picker-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
  .picker-sheet { width: 100%; max-width: 420px; background: var(--surface); border-radius: 20px 20px 0 0; border: 1px solid var(--border);
    padding: 16px; max-height: 70vh; display: flex; flex-direction: column; }
  .picker-search { background: var(--surface-raised); border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px;
    color: var(--text-primary); font-family: var(--font); font-size: 14px; margin-bottom: 12px; width: 100%; }
  .picker-list { overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .picker-item { display: flex; align-items: center; gap: 10px; padding: 11px 10px; border-radius: 10px; }
  .picker-item:active { background: var(--surface-raised); }
  .picker-hint { padding: 22px 10px; text-align: center; font-size: 12.5px; color: var(--text-tertiary); line-height: 1.5; }
  .res-left { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .res-base { font-size: 14.5px; font-weight: 700; }
  .res-pair { font-size: 10.5px; color: var(--text-tertiary); font-family: var(--font-mono); }
  .res-right { flex: none; text-align: right; display: flex; flex-direction: column; gap: 2px; }
  .res-price { font-family: var(--font-mono); font-size: 13px; }
  .res-ch { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; }
  .res-ch.up { color: var(--up); } .res-ch.down { color: var(--down); }
  .res-star { flex: none; width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--surface-raised); color: var(--text-tertiary); font-size: 15px; line-height: 1; }
  .res-star.on { color: var(--warn); border-color: var(--warn); }
  .picker-close { text-align: center; font-size: 13px; color: var(--text-secondary); padding: 10px 0 2px; }
</style>
</head>
<body>
<div class="app-shell">

  <div id="app-header"></div>

  <div class="coin-header">
    <div>
      <div class="coin-pick" id="coin-pick">
        <p class="coin-pair" id="coin-pair">BTC/USDT</p>
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="#8A8F9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span class="coin-price" id="coin-price">—</span>
      <span class="coin-change" id="coin-change"></span>
    </div>
    <div class="tf-pills" id="tf-pills">
      <span class="tf-pill" data-tf="5m">5m</span>
      <span class="tf-pill" data-tf="15m">15m</span>
      <span class="tf-pill" data-tf="1h">1h</span>
      <span class="tf-pill active" data-tf="4h">4h</span>
      <span class="tf-pill" data-tf="1d">1d</span>
    </div>
  </div>

  <div class="verdict-card" id="verdict-card">
    <div class="verdict-left">
      <svg id="verdict-icon" viewBox="0 0 24 24" fill="none"></svg>
      <div>
        <p class="verdict-dir" id="verdict-dir">—</p>
        <p class="verdict-sub" data-i18n="an_verdict_sub">Сетап по confluence-факторам</p>
      </div>
    </div>
    <div class="verdict-conf">
      <div class="num" id="verdict-conf">—</div>
      <div class="lbl" data-i18n="an_conf_label">уверенность</div>
    </div>
  </div>

  <div class="chart-wrap">
    <div id="chart-container"></div>
    <div class="chart-loading" id="chart-loading" data-i18n="an_chart_loading">Загружаю график…</div>
    <svg class="watermark" viewBox="0 0 48 48" fill="none">
      <rect x="1" y="1" width="46" height="46" rx="13" fill="#0B0B0E" stroke="#F2F4F7" stroke-width="1.5"/>
      <path d="M11 30L19 22L25 27L37 14" stroke="#F2F4F7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="ind-tabs" id="ind-tabs" style="display:none">
    <button type="button" class="active" data-ind="none" data-i18n="an_indicator_none">Только цена</button>
    <button type="button" data-ind="rsi">RSI</button>
    <button type="button" data-ind="macd">MACD</button>
  </div>
  <div class="ind-wrap" id="ind-wrap" style="display:none"><div id="ind-container"></div></div>

  <p class="chart-hint" id="chart-hint" style="display:none">↔ pinch / drag</p>
  <p class="corr-line" id="corr-line" style="display:none"></p>

  <div id="content-below" style="display:none">
    <div class="params-card" id="params-card"></div>

    <div class="reasons-card">
      <p class="reasons-title" data-i18n="an_reasons_title">Почему такой сигнал</p>
      <div id="reasons-list"></div>
      <a class="factors-link" href="#" id="factors-link" data-i18n="an_factors_link">Все факторы →</a>
    </div>

    <p class="disclaimer" data-i18n="an_disclaimer">⚠️ Не является инвестиционной рекомендацией</p>
  </div>

  <div class="lock-card" id="lock-card" style="display:none">
    <p id="lock-text" data-i18n="an_lock_text">Полный анализ этой монеты доступен по подписке. Бесплатно можно посмотреть BTC/USDT на 4ч.</p>
    <button class="lock-btn" id="lock-btn" data-i18n="an_lock_btn">Оформить подписку — $59/мес</button>
  </div>
</div>

<div class="picker-overlay" id="picker-overlay">
  <div class="picker-sheet">
    <input class="picker-search" id="picker-search" data-i18n-placeholder="an_picker_search" placeholder="Найти монету, например BTC" />
    <div class="picker-list" id="picker-list"></div>
    <div class="picker-close" id="picker-close" data-i18n="close">Закрыть</div>
  </div>
</div>

<script>
  renderHeader({ title: t('an_word'), showBack: true, backHref: '02-main-menu.html' });

  const params = new URLSearchParams(window.location.search);
  let currentSymbol = params.get('symbol') || 'BTC/USDT';
  let currentTf = params.get('timeframe') || '4h';
  let chart = null, candleSeries = null, volumeSeries = null, priceLines = [];
  let indChart = null, activeIndicator = 'none', lastData = null, liveTimer = null;
  const extraSeries = [];
  const indSeries = [];
  const LIVE_INTERVAL_MS = 5000;   // живое обновление раз в 5 секунд
  const VISIBLE_CANDLES = 60;      // сколько свечей показываем по умолчанию
  const chartLibAvailable = typeof LightweightCharts !== 'undefined';

  function setActiveTf(tf) {
    document.querySelectorAll('.tf-pill').forEach(function (p) {
      p.classList.toggle('active', p.getAttribute('data-tf') === tf);
    });
  }

  function ensureChart() {
    if (chart || !chartLibAvailable) return;
    chart = LightweightCharts.createChart(document.getElementById('chart-container'), {
      layout: {
        background: { color: '#0B0B0E' }, textColor: '#8A8F9C',
        fontFamily: 'SF Mono, Consolas, monospace', fontSize: 10,
        attributionLogo: false,          // убираем логотип TradingView с графика
      },
      grid: { vertLines: { color: '#14141A' }, horzLines: { color: '#14141A' } },
      rightPriceScale: {
        borderColor: '#1E1E24',
        // Без отступов шкала цен наезжала на свечи, а верхние/нижние
        // экстремумы упирались в край области построения.
        scaleMargins: { top: 0.12, bottom: 0.28 },
      },
      timeScale: {
        borderColor: '#1E1E24', timeVisible: true, secondsVisible: false,
        rightOffset: 4, barSpacing: 7, minBarSpacing: 2,
      },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      // Жесты: перетаскивание и pinch-zoom на тач-экране
      handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
      handleScale: { mouseWheel: true, pinch: true, axisPressedMouseMove: true },
      width: document.getElementById('chart-container').clientWidth,
      height: document.getElementById('chart-container').clientHeight,
    });
    candleSeries = chart.addCandlestickSeries({
      upColor: '#1FCF6C', downColor: '#F6465D', borderVisible: false,
      wickUpColor: '#1FCF6C', wickDownColor: '#F6465D',
    });
    volumeSeries = chart.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: '', color: '#1FCF6C' });
    volumeSeries.priceScale().applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });

    window.addEventListener('resize', function () {
      if (!chart) return;
      chart.applyOptions({ width: document.getElementById('chart-container').clientWidth });
    });
  }

  /**
   * Отдельный график под основным для RSI/MACD. Своя шкала нужна потому,
   * что диапазоны несопоставимы с ценой: RSI живёт в 0..100, гистограмма
   * MACD колеблется около нуля — на одной оси с ценой они бы схлопнулись
   * в плоскую линию.
   */
  function ensureIndicatorChart() {
    if (indChart || !chartLibAvailable) return;
    const host = document.getElementById('ind-container');
    indChart = LightweightCharts.createChart(host, {
      layout: { background: { color: '#0B0B0E' }, textColor: '#8A8F9C', fontFamily: 'SF Mono, Consolas, monospace', fontSize: 9 },
      grid: { vertLines: { color: '#14141A' }, horzLines: { color: '#14141A' } },
      rightPriceScale: { borderColor: '#1E1E24' },
      timeScale: { borderColor: '#1E1E24', timeVisible: true, secondsVisible: false },
      handleScroll: true, handleScale: true,
      width: host.clientWidth, height: host.clientHeight,
    });

    // Синхронный зум: двигаешь основной график — двигается и индикатор.
    // Флаг syncing защищает от рекурсии, когда подписки дёргают друг друга.
    let syncing = false;
    const link = function (from, to) {
      from.timeScale().subscribeVisibleLogicalRangeChange(function (range) {
        if (syncing || !range) return;
        syncing = true;
        try { to.timeScale().setVisibleLogicalRange(range); } catch (e) {}
        syncing = false;
      });
    };
    if (chart) { link(chart, indChart); link(indChart, chart); }
  }

  function clearIndicatorSeries() {
    indSeries.forEach(function (s) { try { indChart.removeSeries(s); } catch (e) {} });
    indSeries.length = 0;
  }

  function renderIndicator(kind) {
    const tabs = document.getElementById('ind-tabs');
    tabs.querySelectorAll('button').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-ind') === kind);
    });

    const wrap = document.getElementById('ind-wrap');
    if (kind === 'none' || !lastData || !chartLibAvailable) {
      wrap.style.display = 'none';
      return;
    }
    wrap.style.display = 'block';
    ensureIndicatorChart();
    if (!indChart) { wrap.style.display = 'none'; return; }
    clearIndicatorSeries();

    const c = lastData.chart;
    if (kind === 'rsi' && c.rsi && c.rsi.length) {
      const line = indChart.addLineSeries({ color: '#00E5C7', lineWidth: 1, priceLineVisible: false });
      line.setData(c.rsi);
      // Уровни 70/30 — стандартные границы перекупленности/перепроданности
      line.createPriceLine({ price: 70, color: 'rgba(246,70,93,0.5)', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: '70' });
      line.createPriceLine({ price: 30, color: 'rgba(31,207,108,0.5)', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: '30' });
      indSeries.push(line);
    } else if (kind === 'macd' && c.macd && c.macd.length) {
      if (c.macd_hist && c.macd_hist.length) {
        const hist = indChart.addHistogramSeries({ priceLineVisible: false });
        hist.setData(c.macd_hist);
        indSeries.push(hist);
      }
      const macdLine = indChart.addLineSeries({ color: '#00E5C7', lineWidth: 1, priceLineVisible: false });
      macdLine.setData(c.macd);
      indSeries.push(macdLine);
      if (c.macd_signal && c.macd_signal.length) {
        const sig = indChart.addLineSeries({ color: '#F0B90B', lineWidth: 1, priceLineVisible: false });
        sig.setData(c.macd_signal);
        indSeries.push(sig);
      }
    }
    try { indChart.timeScale().setVisibleLogicalRange(chart.timeScale().getVisibleLogicalRange()); } catch (e) {}
  }

  function clearExtraSeries() {
    extraSeries.forEach(function (s) { try { chart.removeSeries(s); } catch (e) {} });
    extraSeries.length = 0;
  }

  function addZone(timeStart, timeEnd, top, bottom, color, label) {
    if (!timeStart || !timeEnd || top === bottom) return;
    const upper = chart.addLineSeries({ color: color, lineWidth: 1, lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false });
    upper.setData([{ time: timeStart, value: top }, { time: timeEnd, value: top }]);
    const lower = chart.addLineSeries({ color: color, lineWidth: 1, lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false });
    lower.setData([{ time: timeStart, value: bottom }, { time: timeEnd, value: bottom }]);
    if (label) upper.setMarkers([{ time: timeEnd, position: 'inBar', color: color, shape: 'square', text: label, size: 0 }]);
    extraSeries.push(upper, lower);
  }

  function addHLine(timeStart, timeEnd, price, color, dashed) {
    if (price === null || price === undefined) return;
    const s = chart.addLineSeries({ color: color, lineWidth: 1, lineStyle: dashed ? 2 : 0, lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false });
    s.setData([{ time: timeStart, value: price }, { time: timeEnd, value: price }]);
    extraSeries.push(s);
  }

  function buildChart(data) {
    ensureChart();
    if (!chart) throw new Error('chart-lib-unavailable');
    clearExtraSeries();

    candleSeries.setData(data.chart.candles);
    volumeSeries.setData(data.chart.volumes);

    if (data.chart.ema20) {
      const e20 = chart.addLineSeries({ color: '#00E5C7', lineWidth: 1, lastValueVisible: false, priceLineVisible: false });
      e20.setData(data.chart.ema20);
      extraSeries.push(e20);
    }
    if (data.chart.ema50) {
      const e50 = chart.addLineSeries({ color: '#F0B90B', lineWidth: 1, lastValueVisible: false, priceLineVisible: false });
      e50.setData(data.chart.ema50);
      extraSeries.push(e50);
    }

    const tEnd = data.chart.candles.length ? data.chart.candles[data.chart.candles.length - 1].time : null;
    (data.sr.support || []).slice(0, 2).forEach(function (lvl) { addHLine(lvl.time_start, tEnd, lvl.price, 'rgba(0,229,199,0.55)', true); });
    (data.sr.resistance || []).slice(0, 2).forEach(function (lvl) { addHLine(lvl.time_start, tEnd, lvl.price, 'rgba(246,70,93,0.55)', true); });

    if (data.smc) {
      (data.smc.bull_obs || []).forEach(function (z) { addZone(z.time_start, z.time_end, z.top, z.bottom, 'rgba(31,207,108,0.5)', 'OB'); });
      (data.smc.bear_obs || []).forEach(function (z) { addZone(z.time_start, z.time_end, z.top, z.bottom, 'rgba(246,70,93,0.5)', 'OB'); });
      (data.smc.bull_fvgs || []).forEach(function (z) { addZone(z.time_start, z.time_end, z.top, z.bottom, 'rgba(0,229,199,0.35)', 'FVG'); });
      (data.smc.bear_fvgs || []).forEach(function (z) { addZone(z.time_start, z.time_end, z.top, z.bottom, 'rgba(246,70,93,0.35)', 'FVG'); });
    }

    // Подписи паттернов раньше налезали друг на друга и обрезались краем:
    // на каждую линию вешался полный текст. Теперь — короткая метка, и не
    // больше одной подписи в одной точке времени.
    const labelledTimes = new Set();
    (data.patterns || []).forEach(function (p) {
      const short = shortPatternLabel(p.label);
      (p.lines || []).forEach(function (line) {
        if (!line.length) return;
        const s = chart.addLineSeries({ color: '#F0B90B', lineWidth: 1, lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false });
        s.setData(line.map(function (pt) { return { time: pt.time, value: pt.price }; }));

        const at = line[line.length - 1].time;
        if (!labelledTimes.has(at)) {
          labelledTimes.add(at);
          s.setMarkers([{
            time: at, position: 'aboveBar', color: '#F0B90B',
            shape: 'circle', text: short, size: 1,
          }]);
        }
        extraSeries.push(s);
      });
    });

    priceLines.forEach(function (pl) { try { candleSeries.removePriceLine(pl); } catch (e) {} });
    priceLines = [];
    if (data.trade_levels && data.trade_levels.entry) {
      const tl = data.trade_levels;
      priceLines.push(candleSeries.createPriceLine({ price: tl.entry, color: '#00E5C7', lineWidth: 2, lineStyle: 0, axisLabelVisible: true, title: t('an_entry') }));
      priceLines.push(candleSeries.createPriceLine({ price: tl.stop, color: '#F6465D', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: 'SL' }));
      (tl.targets || []).forEach(function (tp, i) {
        priceLines.push(candleSeries.createPriceLine({ price: tp, color: '#1FCF6C', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: 'TP' + (i + 1) }));
      });
    }

    // Показываем последние ~60 свечей, а не всю историю: при fitContent()
    // сотни баров сжимались в нечитаемую полосу. Прокрутка влево открывает
    // более старые данные.
    const total = data.chart.candles.length;
    if (total > VISIBLE_CANDLES) {
      chart.timeScale().setVisibleLogicalRange({ from: total - VISIBLE_CANDLES, to: total + 3 });
    } else {
      chart.timeScale().fitContent();
    }
  }

  /**
   * Короткая метка паттерна для графика: полные названия («Двойная вершина»,
   * «Перевёрнутая голова и плечи») не помещаются и перекрывают друг друга.
   */
  function shortPatternLabel(label) {
    if (!label) return '';
    const map = {
      'Двойная вершина': '2T', 'Двойное дно': '2B',
      'Голова и плечи': 'H&S', 'Перевёрнутая голова и плечи': 'iH&S',
      'Double Top': '2T', 'Double Bottom': '2B',
      'Head and Shoulders': 'H&S', 'Inverse Head and Shoulders': 'iH&S',
    };
    if (map[label]) return map[label];
    // Треугольники, флаги и прочее: аббревиатура из первых букв слов
    const words = String(label).split(/[\s-]+/).filter(Boolean);
    if (words.length > 1) return words.map(function (w) { return w[0].toUpperCase(); }).join('');
    return label.length > 8 ? label.slice(0, 8) + '…' : label;
  }

  function renderVerdict(setup) {
    const card = document.getElementById('verdict-card');
    const dir = document.getElementById('verdict-dir');
    const icon = document.getElementById('verdict-icon');
    const conf = document.getElementById('verdict-conf');

    card.className = 'verdict-card';
    dir.className = 'verdict-dir';
    if (setup.signal === 'BUY') {
      card.classList.add('buy'); dir.classList.add('buy'); dir.textContent = 'LONG';
      icon.innerHTML = '<path d="M5 16L10 10L14 13L19 6" stroke="#1FCF6C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 6H19V11" stroke="#1FCF6C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';
      conf.style.color = '#1FCF6C';
    } else if (setup.signal === 'SELL') {
      card.classList.add('sell'); dir.classList.add('sell'); dir.textContent = 'SHORT';
      icon.innerHTML = '<path d="M5 8L10 14L14 11L19 18" stroke="#F6465D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 18H19V13" stroke="#F6465D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';
      conf.style.color = '#F6465D';
    } else {
      dir.classList.add('wait'); dir.textContent = t('an_wait');
      icon.innerHTML = '<circle cx="12" cy="12" r="8" stroke="#8A8F9C" stroke-width="1.8"/><path d="M9 12H15" stroke="#8A8F9C" stroke-width="1.8" stroke-linecap="round"/>';
      conf.style.color = '#8A8F9C';
    }
    conf.textContent = setup.confidence + '%';
  }

  function renderParams(setup) {
    const el = document.getElementById('params-card');
    if (setup.signal === 'WAIT' || !setup.entry) {
      el.innerHTML = '<div class="param-row"><span class="param-label">' + t('an_setup_label') + '</span><span class="param-value">' + t('an_no_setup') + '</span></div>';
      return;
    }
    const entry = setup.entry;
    function pctRow(label, value, cls) {
      if (value === null || value === undefined) return '';
      const pct = (value / entry - 1) * 100;
      return '<div class="param-row"><span class="param-label">' + label + '</span><span class="param-value ' + cls + '">$' + fmtPrice(value) + '<span class="pct ' + cls + '">' + fmtPct(pct) + '</span></span></div>';
    }
    let html = '<div class="param-row"><span class="param-label">' + t('an_entry') + '</span><span class="param-value accent">$' + fmtPrice(entry) + '</span></div>';
    html += pctRow(t('an_stop'), setup.stop_loss, 'down');
    (setup.take_profits || []).forEach(function (tp, i) { html += pctRow('TP' + (i + 1), tp, 'up'); });
    html += '<div class="param-row"><span class="param-label">' + t('an_rr') + '</span><span class="param-value accent">' + (setup.risk_reward ? '1 : ' + setup.risk_reward : '—') + '</span></div>';
    el.innerHTML = html;
  }

  function renderReasons(reasons) {
    const el = document.getElementById('reasons-list');
    if (!reasons || !reasons.length) {
      el.innerHTML = '<div class="reason-row"><div class="reason-text">' + t('an_reasons_empty') + '</div></div>';
      return;
    }
    el.innerHTML = reasons.map(function (r) {
      return '<div class="reason-row"><div class="reason-dot"></div><div class="reason-text">' + r + '</div></div>';
    }).join('');
  }

  async function loadAnalysis() {
    document.getElementById('coin-pair').textContent = currentSymbol;
    setActiveTf(currentTf);
    document.getElementById('chart-loading').style.display = 'flex';
    document.getElementById('chart-loading').textContent = t('an_chart_loading');
    document.getElementById('chart-hint').style.display = 'none';
    document.getElementById('content-below').style.display = 'none';
    document.getElementById('lock-card').style.display = 'none';
    renderStickyButton({ text: t('an_main_btn'), onClick: refreshAnalysis, disabled: true });

    let r;
    try {
      r = await apiFetch('/api/analysis?' + qs({ symbol: currentSymbol, timeframe: currentTf }));
    } catch (e) {
      r = { ok: false, status: 0, data: null };
    }

    renderStickyButton({ text: t('an_main_btn'), onClick: refreshAnalysis });

    if (r.status === 402) {
      document.getElementById('chart-loading').textContent = t('an_locked_title');
      document.getElementById('lock-card').style.display = 'block';
      document.getElementById('verdict-dir').textContent = t('an_locked_short');
      document.getElementById('verdict-conf').textContent = '';
      return;
    }
    // Свежелистнутая пара: торгуется, но истории мало. Говорим что именно
    // не так и что делать, вместо общего «нет данных».
    if (r.status === 422 && r.data) {
      document.getElementById('chart-loading').textContent =
        t('an_insufficient', { n: r.data.candles, need: r.data.required });
      return;
    }
    if (!r.ok || !r.data) {
      document.getElementById('chart-loading').textContent = t('an_no_data', { symbol: currentSymbol });
      return;
    }

    const data = r.data;
    lastData = data;
    document.getElementById('coin-price').textContent = '$' + fmtPrice(data.price);
    const chEl = document.getElementById('coin-change');
    if (data.change_24h !== null) {
      chEl.textContent = (data.change_24h >= 0 ? '▲ ' : '▼ ') + fmtPct(data.change_24h);
      chEl.className = 'coin-change ' + (data.change_24h >= 0 ? 'up' : 'down');
    } else {
      chEl.textContent = '';
    }

    renderVerdict(data.setup);

    try {
      buildChart(data);
      document.getElementById('chart-loading').style.display = 'none';
      document.getElementById('chart-hint').style.display = 'block';
    } catch (e) {
      document.getElementById('chart-loading').textContent = t('an_no_data', { symbol: currentSymbol });
    }

    renderParams(data.setup);
    renderReasons(data.setup.reasons);
    renderCorrelation(data.btc_correlation);
    document.getElementById('ind-tabs').style.display = 'flex';
    renderIndicator(activeIndicator);
    document.getElementById('content-below').style.display = 'block';
    startLiveUpdates();
  }

  function renderCorrelation(corr) {
    const el = document.getElementById('corr-line');
    if (corr === null || corr === undefined) { el.style.display = 'none'; return; }
    let word;
    if (corr >= 0.6) word = t('an_btc_corr_high');
    else if (corr <= -0.3) word = t('an_btc_corr_inv');
    else word = t('an_btc_corr_low');
    el.innerHTML = t('an_btc_corr') + ': <b>' + corr.toFixed(2) + '</b> — ' + word;
    el.style.display = 'block';
  }

  /**
   * Живое обновление цены и последней свечи (п. 3.9 ТЗ).
   * Полный анализ не пересчитываем: он тяжёлый (сеть + CPU на сервере),
   * и дёргать его каждые 5 секунд для каждого пользователя — прямой путь
   * в rate limit биржи. Обновляем только котировку и текущую свечу.
   */
  function startLiveUpdates() {
    stopLiveUpdates();
    liveTimer = setInterval(async function () {
      if (document.hidden) return;   // вкладка скрыта — не жжём трафик
      const r = await apiFetch('/api/analysis?' + qs({ symbol: currentSymbol, timeframe: currentTf }));
      if (!r.ok || !r.data || !r.data.chart || !r.data.chart.candles.length) return;

      const d = r.data;
      document.getElementById('coin-price').textContent = '$' + fmtPrice(d.price);
      const chEl = document.getElementById('coin-change');
      if (d.change_24h !== null) {
        chEl.textContent = (d.change_24h >= 0 ? '▲ ' : '▼ ') + fmtPct(d.change_24h);
        chEl.className = 'coin-change ' + (d.change_24h >= 0 ? 'up' : 'down');
      }
      if (candleSeries) {
        const last = d.chart.candles[d.chart.candles.length - 1];
        // update() дорисовывает/заменяет последнюю свечу, не перестраивая
        // весь ряд — иначе сбивался бы зум и позиция прокрутки.
        try { candleSeries.update(last); } catch (e) {}
      }
      lastData = d;
    }, LIVE_INTERVAL_MS);
  }

  function stopLiveUpdates() {
    if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
  }

  window.addEventListener('beforeunload', stopLiveUpdates);

  document.getElementById('lock-btn').addEventListener('click', function () { haptic('light'); goTo('06-subscription.html'); });
  document.getElementById('factors-link').addEventListener('click', function (e) {
    e.preventDefault();
    haptic('light');
    goTo('05-factors.html?' + qs({ symbol: currentSymbol, timeframe: currentTf }));
  });

  document.querySelectorAll('.tf-pill').forEach(function (p) {
    p.addEventListener('click', function () {
      haptic('light');
      currentTf = p.getAttribute('data-tf');
      loadAnalysis();
    });
  });

  document.querySelectorAll('#ind-tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      haptic('light');
      activeIndicator = b.getAttribute('data-ind');
      renderIndicator(activeIndicator);
    });
  });

  function refreshAnalysis() { haptic('medium'); loadAnalysis(); }

  // Поиск идёт по ВСЕМ парам биржи через /api/search, а не по watchlist:
  // watchlist — это то, что сканирует скринер, и он намеренно маленький.
  const pickerOverlay = document.getElementById('picker-overlay');
  const pickerList = document.getElementById('picker-list');
  const pickerSearch = document.getElementById('picker-search');
  let searchTimer = null;
  let marketStats = null;

  async function openPicker() {
    haptic('light');
    pickerOverlay.style.display = 'flex';
    pickerSearch.value = '';
    pickerSearch.focus();
    renderHint(t('search_min_chars'));

    if (!marketStats) {
      const r = await apiFetch('/api/markets/stats');
      if (r.ok && r.data) {
        marketStats = r.data;
        renderHint(t('search_all_pairs', {
          n: marketStats.total_pairs, ex: exchangeName(marketStats.exchange),
        }));
      }
    } else {
      renderHint(t('search_all_pairs', {
        n: marketStats.total_pairs, ex: exchangeName(marketStats.exchange),
      }));
    }
  }

  function renderHint(text) {
    pickerList.innerHTML = '<div class="picker-hint">' + escapeHtml(text) + '</div>';
  }

  function renderResults(data) {
    const results = data.results || [];
    if (!results.length) {
      renderHint(t('search_nothing', { q: data.query }));
      return;
    }
    pickerList.innerHTML = results.map(function (s) {
      const price = s.price !== null && s.price !== undefined ? '$' + fmtPrice(s.price) : '';
      const ch = s.change_24h !== null && s.change_24h !== undefined
        ? '<span class="res-ch ' + (s.change_24h >= 0 ? 'up' : 'down') + '">' + fmtPct(s.change_24h) + '</span>' : '';
      return '<div class="picker-item" data-symbol="' + escapeAttr(s.symbol) + '">' +
        '<div class="res-left"><span class="res-base">' + escapeHtml(s.base) + '</span>' +
        '<span class="res-pair">' + escapeHtml(s.symbol) + '</span></div>' +
        '<div class="res-right"><span class="res-price">' + price + '</span>' + ch + '</div>' +
        '<button type="button" class="res-star' + (s.in_watchlist ? ' on' : '') + '" ' +
        'data-star="' + escapeAttr(s.symbol) + '" title="' + t('search_add_watchlist') + '">★</button>' +
        '</div>';
    }).join('');

    pickerList.querySelectorAll('.picker-item').forEach(function (item) {
      item.addEventListener('click', function (e) {
        if (e.target.classList.contains('res-star')) return;   // звезда — отдельное действие
        haptic('light');
        currentSymbol = item.getAttribute('data-symbol');
        pickerOverlay.style.display = 'none';
        loadAnalysis();
      });
    });

    pickerList.querySelectorAll('.res-star').forEach(function (star) {
      star.addEventListener('click', async function (e) {
        e.stopPropagation();
        haptic('light');
        const r = await apiFetch('/api/watchlist', {
          method: 'POST',
          body: JSON.stringify({ symbol: star.getAttribute('data-star'), action: 'toggle' }),
        });
        if (r.status === 409 && r.data) {
          notify('error');
          alert(r.data.error === 'watchlist_full'
            ? t('search_watchlist_full', { max: r.data.max })
            : t('search_watchlist_min'));
          return;
        }
        if (r.ok && r.data) {
          star.classList.toggle('on', r.data.in_watchlist);
          notify('success');
        }
      });
    });
  }

  pickerSearch.addEventListener('input', function () {
    const q = pickerSearch.value.trim();
    clearTimeout(searchTimer);
    if (q.length < 2) {
      renderHint(marketStats
        ? t('search_all_pairs', { n: marketStats.total_pairs, ex: exchangeName(marketStats.exchange) })
        : t('search_min_chars'));
      return;
    }
    // Дебаунс: запрос уходит на сервер, дёргать его на каждую букву незачем.
    searchTimer = setTimeout(async function () {
      const r = await apiFetch('/api/search?' + qs({ q: q }));
      if (r.ok && r.data) renderResults(r.data);
    }, 250);
  });

  document.getElementById('coin-pick').addEventListener('click', openPicker);
  document.getElementById('picker-close').addEventListener('click', function () { pickerOverlay.style.display = 'none'; });
  pickerOverlay.addEventListener('click', function (e) { if (e.target === pickerOverlay) pickerOverlay.style.display = 'none'; });

  loadAnalysis();
</script>
</body>
