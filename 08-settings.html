<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Seno — Профиль и настройки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="locales.js?v=fdecc66a"></script>
<script src="shared.js?v=2a001283"></script>
<style>
  :root {
    --bg: #000000; --surface: #0B0B0E; --surface-raised: #131318; --border: #1E1E24;
    --text-primary: #F2F4F7; --text-secondary: #8A8F9C; --text-tertiary: #5A5F6B;
    --accent: #00E5C7; --up: #1FCF6C; --down: #F6465D;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Roboto, sans-serif;
    --font-mono: "SF Mono", "SFMono-Regular", Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text-primary); font-family: var(--font); }
  body { display: flex; justify-content: center; }
  .app-shell { width: 100%; max-width: 420px; min-height: 100vh; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }

  .profile-card { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 18px; min-height: 72px; }
  .profile-avatar { flex: none; width: 48px; height: 48px; border-radius: 50%; background: var(--surface-raised); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: var(--text-secondary); }
  .profile-info { flex: 1; min-width: 0; }
  .profile-name { font-size: 15px; font-weight: 700; }
  .profile-username { font-size: 12.5px; color: var(--text-secondary); margin-top: 1px; }
  .profile-date { font-size: 11px; color: var(--text-tertiary); margin-top: 3px; }
  .profile-badge { flex: none; font-size: 10.5px; font-weight: 700; color: var(--text-secondary); background: var(--surface-raised); border: 1px solid var(--border); padding: 4px 8px; border-radius: 8px; }
  .profile-badge.active { color: #04342C; background: var(--up); border-color: var(--up); }

  .group-title { font-size: 12px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-tertiary); margin: 0 0 8px 2px; }
  .group-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 18px; overflow: hidden; }

  .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 14px; border-bottom: 1px solid var(--border); }
  .setting-row:last-child { border-bottom: none; }
  .setting-row.stacked { display: block; }
  .setting-label { font-size: 13.5px; color: var(--text-primary); }
  .setting-value { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary); }
  .setting-hint { font-size: 11px; color: var(--text-tertiary); margin: 3px 0 0; }

  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .chip { border: 1px solid var(--border); background: var(--surface-raised); color: var(--text-secondary);
    font-family: var(--font); font-size: 12px; font-weight: 700; padding: 7px 12px; border-radius: 9px; }
  .chip.active { background: var(--accent); color: #04342C; border-color: var(--accent); }
  .chip:active { opacity: 0.8; }
  .chip.mono { font-family: var(--font-mono); }

  .link-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 14px; border-bottom: 1px solid var(--border); }
  .link-row:last-child { border-bottom: none; }
  .link-row:active { background: var(--surface-raised); }
  .link-row .chev { color: var(--text-tertiary); font-size: 16px; flex: none; }

  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--up); color: #04342C;
    font-size: 12.5px; font-weight: 700; padding: 8px 16px; border-radius: 10px; opacity: 0; transition: opacity 0.2s; z-index: 60; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--down); color: #fff; }


  .footer { text-align: center; margin-top: 6px; margin-bottom: 90px; }
  .footer svg { width: 22px; height: 22px; opacity: 0.35; margin-bottom: 8px; }
  .footer .ver { font-size: 11px; color: var(--text-tertiary); margin: 0 0 6px; }
  .footer .disc { font-size: 10.5px; color: var(--text-tertiary); line-height: 1.5; padding: 0 20px; margin: 0; }
</style>
</head>
<body>
<div class="app-shell">

  <div id="app-header"></div>

  <div class="profile-card">
    <div class="profile-avatar" id="avatar">–</div>
    <div class="profile-info">
      <div class="profile-name" id="p-name">—</div>
      <div class="profile-username" id="p-username"></div>
      <div class="profile-date" id="p-date"></div>
    </div>
    <span class="profile-badge" id="p-badge">—</span>
  </div>

  <p class="group-title" data-i18n="set_trading">Торговля</p>
  <div class="group-card">
    <div class="setting-row stacked">
      <span class="setting-label" data-i18n="set_exchange">Биржа для данных</span>
      <div class="chip-row" id="exchange-row"></div>
    </div>
    <div class="setting-row stacked">
      <span class="setting-label" data-i18n="set_timeframe">Таймфрейм по умолчанию</span>
      <div class="chip-row" id="tf-row"></div>
    </div>
  </div>

  <p class="group-title" data-i18n="set_account">Аккаунт</p>
  <div class="group-card">
    <div class="setting-row"><span class="setting-label" data-i18n="set_tg_id">Telegram ID</span><span class="setting-value" id="p-id">—</span></div>
    <div class="setting-row">
      <span class="setting-label" data-i18n="set_lang">Язык</span>
      <div class="chip-row" id="lang-row" style="margin-top:0"></div>
    </div>
  </div>

  <div class="footer">
    <svg viewBox="0 0 48 48" fill="none"><rect x="1" y="1" width="46" height="46" rx="13" fill="none" stroke="#F2F4F7" stroke-width="2"/><path d="M11 30L19 22L25 27L37 14" stroke="#F2F4F7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <p class="ver">Seno</p>
    <p class="disc" data-i18n="set_disclaimer">Аналитика не является инвестиционной рекомендацией. Торговля криптовалютой сопряжена с риском потери средств.</p>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  if (tg && tg.BackButton) { try { tg.BackButton.hide(); } catch (e) {} }
  renderHeader({ title: t('set_word') });
  renderBottomNav('settings');

  let cfg = null;              // текущие настройки с сервера

  function showToast(message, isError) {
    const el = document.getElementById('toast');
    el.textContent = message;
    el.className = 'toast show' + (isError ? ' err' : '');
    setTimeout(function () { el.className = 'toast'; }, 1600);
  }

  /**
   * Сохраняет патч настроек. Локальное состояние обновляем только после
   * ответа сервера: иначе при неудачном запросе интерфейс показывал бы
   * настройку, которой на сервере нет.
   */
  async function saveSettings(patch, onOk) {
    const r = await apiFetch('/api/settings', { method: 'POST', body: JSON.stringify(patch) });
    if (!r.ok || !r.data) {
      notify('error');
      showToast(t('set_save_failed'), true);
      return false;
    }
    cfg = r.data;
    renderControls();
    if (onOk) onOk();
    showToast(t('saved'));
    return true;
  }

  function chip(label, active, mono) {
    return '<button type="button" class="chip' + (active ? ' active' : '') + (mono ? ' mono' : '') +
      '" data-value="' + label + '">' + label + '</button>';
  }

  function renderControls() {
    if (!cfg) return;
    const av = cfg.available;

    const exRow = document.getElementById('exchange-row');
    exRow.innerHTML = av.exchanges.map(function (ex) {
      return '<button type="button" class="chip' + (ex === cfg.exchange ? ' active' : '') +
        '" data-value="' + ex + '">' + exchangeName(ex) + '</button>';
    }).join('');
    exRow.querySelectorAll('.chip').forEach(function (b) {
      b.addEventListener('click', function () {
        const v = b.getAttribute('data-value');
        if (v === cfg.exchange) return;
        haptic('light');
        saveSettings({ exchange: v });
      });
    });

    const tfRow = document.getElementById('tf-row');
    tfRow.innerHTML = av.timeframes.map(function (tf) { return chip(tf, tf === cfg.default_timeframe, true); }).join('');
    tfRow.querySelectorAll('.chip').forEach(function (b) {
      b.addEventListener('click', function () {
        const v = b.getAttribute('data-value');
        if (v === cfg.default_timeframe) return;
        haptic('light');
        saveSettings({ default_timeframe: v });
      });
    });

    const langRow = document.getElementById('lang-row');
    langRow.innerHTML = av.languages.map(function (l) { return chip(l.toUpperCase(), l === cfg.language); }).join('');
    langRow.querySelectorAll('.chip').forEach(function (b) {
      b.addEventListener('click', function () {
        const v = b.getAttribute('data-value').toLowerCase();
        if (v === cfg.language) return;
        haptic('light');
        setLang(v);   // сам сохранит на сервер и перезагрузит экран
      });
    });

  }

  async function load() {
    const [meRes, cfgRes] = await Promise.all([apiFetch('/api/me'), apiFetch('/api/settings')]);

    if (meRes.ok && meRes.data) {
      const me = meRes.data;
      syncLangFromServer(me.language);
      document.getElementById('avatar').textContent = (me.first_name || '?').slice(0, 1).toUpperCase();
      document.getElementById('p-name').textContent = me.first_name || t('set_trader');
      document.getElementById('p-username').textContent = me.username ? '@' + me.username : '';
      document.getElementById('p-date').textContent = me.created_at ? t('set_on_since', { date: dateRu(me.created_at) }) : '';
      document.getElementById('p-id').textContent = me.telegram_id;
      const badge = document.getElementById('p-badge');
      if (me.subscription.active) {
        badge.textContent = t('set_active');
        badge.classList.add('active');
      } else {
        badge.textContent = t('set_no_sub');
      }
    } else {
      document.getElementById('p-name').textContent = t('set_no_profile');
    }

    if (cfgRes.ok && cfgRes.data) {
      cfg = cfgRes.data;
      renderControls();
    }
  }

  load();
</script>
</body>
</html>
