<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Seno</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="locales.js?v=f259db78"></script>
<script src="shared.js?v=2a001283"></script>
<style>
  :root {
    --bg: #000000; --surface: #0B0B0E; --surface-raised: #131318; --border: #1E1E24;
    --text-primary: #F2F4F7; --text-secondary: #8A8F9C; --text-tertiary: #5A5F6B;
    --accent: #00E5C7;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text-primary);
    font-family: var(--font); min-height: 100vh; overscroll-behavior-y: none; }
  body { display: flex; justify-content: center; }

  .app-shell { width: 100%; max-width: 420px; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px 20px calc(28px + env(safe-area-inset-bottom)); }

  .logo { width: 104px; height: 104px; filter: drop-shadow(0 0 28px rgba(0, 229, 199, 0.3)); margin-bottom: 18px; }
  .wordmark { font-size: 40px; font-weight: 700; letter-spacing: -0.03em; margin: 0; }

  .cta { margin-top: 40px; width: 100%; max-width: 320px; height: 54px; border: none; border-radius: 14px;
    background: var(--accent); color: #04342C; font-family: var(--font); font-size: 15.5px; font-weight: 700;
    box-shadow: 0 10px 30px rgba(0, 229, 199, 0.26); }
  .cta:active { transform: scale(0.98); opacity: 0.92; }

  .lang { position: absolute; top: calc(16px + env(safe-area-inset-top)); right: 18px; }
</style>
</head>
<body>
<div class="app-shell">

  <div class="lang" id="lang-host"></div>

  <svg class="logo" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="1" y="1" width="46" height="46" rx="13" fill="#0B0B0E" stroke="#1E1E24" stroke-width="1.5"/>
    <path d="M11 30L19 22L25 27L37 14" stroke="#00E5C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="37" cy="14" r="3" fill="#00E5C7"/>
  </svg>
  <p class="wordmark">Seno</p>

  <button class="cta" id="cta" data-i18n="onb_cta">See signals</button>
</div>

<script>
  document.getElementById('lang-host').innerHTML = langSwitchHtml();
  wireLangSwitchers();

  document.getElementById('cta').addEventListener('click', function () {
    haptic('medium');
    goTo('02-main-menu.html');
  });
</script>
</body>
</html>
