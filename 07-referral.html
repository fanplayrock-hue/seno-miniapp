<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Seno — Рефералы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="shared.js"></script>
<style>
  :root {
    --bg: #000000; --surface: #0B0B0E; --surface-raised: #131318; --border: #1E1E24;
    --text-primary: #F2F4F7; --text-secondary: #8A8F9C; --text-tertiary: #5A5F6B;
    --accent: #00E5C7; --up: #1FCF6C; --down: #F6465D; --warn: #F0B90B;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Roboto, sans-serif;
    --font-mono: "SF Mono", "SFMono-Regular", Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text-primary); font-family: var(--font); }
  body { display: flex; justify-content: center; }
  .app-shell { width: 100%; max-width: 420px; min-height: 100vh; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }

  .topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .back-btn { width: 30px; height: 30px; border-radius: 9px; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
  .back-btn svg { width: 15px; height: 15px; }
  .topbar .word { font-size: 14px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-secondary); }

  .hero {
    position: relative; text-align: center; padding: 26px 16px 22px; margin-bottom: 14px; border-radius: 18px;
    background: radial-gradient(circle at 50% 20%, rgba(0, 229, 199, 0.16), rgba(0,0,0,0) 68%), var(--surface);
    border: 1px solid var(--border); overflow: hidden; min-height: 60px;
  }
  .hero .amount { font-family: var(--font-mono); font-size: 36px; font-weight: 700; letter-spacing: -0.02em; }
  .hero .amount-lbl { font-size: 12.5px; color: var(--text-secondary); margin-top: 4px; }

  .counters { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .counter { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 8px; text-align: center; }
  .counter .cv { font-family: var(--font-mono); font-size: 16px; font-weight: 700; }
  .counter .cl { font-size: 10px; color: var(--text-secondary); margin-top: 3px; line-height: 1.3; }

  .link-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
  .link-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .link-text {
    flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--surface-raised);
    border: 1px solid var(--border); border-radius: 10px; padding: 9px 10px;
  }
  .copy-btn { flex: none; width: 38px; height: 38px; border-radius: 10px; background: var(--surface-raised); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
  .copy-btn svg { width: 16px; height: 16px; }
  .copy-btn.copied { background: var(--up); border-color: var(--up); }
  .share-btn { width: 100%; padding: 11px; border-radius: 10px; background: var(--accent); color: #04342C; font-family: var(--font); font-size: 13.5px; font-weight: 700; border: none; }
  .share-btn:active { opacity: 0.9; }

  .section-title { font-size: 12px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-tertiary); margin: 0 0 10px 2px; }

  .steps { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; }
  .step-row { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; }
  .step-num { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--surface-raised); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; color: var(--accent); }
  .step-text { font-size: 12.5px; color: var(--text-secondary); line-height: 1.4; padding-top: 2px; }
  .step-text b { color: var(--text-primary); }

  .payout-progress { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; }
  .pp-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; }
  .pp-label .l1 { color: var(--text-secondary); }
  .pp-label .l2 { font-weight: 700; font-family: var(--font-mono); }
  .pp-track { height: 6px; border-radius: 3px; background: var(--surface-raised); overflow: hidden; }
  .pp-fill { height: 100%; border-radius: 3px; }
  .pp-note { font-size: 11px; color: var(--text-tertiary); margin: 8px 0 0; }

  .invited-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .invited-row { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; }
  .inv-avatar { flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--surface-raised); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--text-secondary); }
  .inv-info { flex: 1; min-width: 0; }
  .inv-name { font-size: 13px; font-weight: 700; }
  .inv-date { font-size: 11px; color: var(--text-tertiary); margin-top: 1px; }
  .inv-right { flex: none; text-align: right; }
  .inv-status { font-size: 11px; font-weight: 700; }
  .inv-status.paid { color: var(--up); }
  .inv-status.unpaid { color: var(--text-tertiary); }
  .inv-amount { font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .empty-hint { font-size: 12.5px; color: var(--text-tertiary); padding: 8px 2px; }

  #fallback-main-button {
    display: none; align-items: center; justify-content: center; width: 100%; height: 50px;
    background: var(--accent); color: #04342C; font-family: var(--font); font-size: 15px; font-weight: 700;
    border: none; border-radius: 12px; box-shadow: 0 0 20px rgba(0, 229, 199, 0.25);
  }
  #fallback-main-button:active { transform: scale(0.97); }
  #fallback-main-button.disabled { background: var(--surface-raised); color: var(--text-tertiary); box-shadow: none; }
</style>
</head>
<body>
<div class="app-shell">

  <div class="topbar">
    <div class="back-btn" id="back"><svg viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="#F2F4F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <span class="word" data-i18n="ref_word">Seno · Рефералы</span>
  </div>

  <div class="hero"><div class="amount" id="hero-amount">—</div><div class="amount-lbl" data-i18n="ref_earned">Заработано всего</div></div>

  <div class="counters">
    <div class="counter"><div class="cv" id="c-invited">—</div><div class="cl" data-i18n="ref_invited">Приглашено</div></div>
    <div class="counter"><div class="cv" id="c-paid">—</div><div class="cl" data-i18n="ref_paid">Оплатили</div></div>
    <div class="counter"><div class="cv" id="c-available">—</div><div class="cl" data-i18n="ref_available">Доступно к выводу</div></div>
  </div>

  <div class="link-card">
    <div class="link-row">
      <div class="link-text" id="ref-link">t.me/…</div>
      <button class="copy-btn" id="copy-btn">
        <svg viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="12" height="12" rx="2" stroke="#F2F4F7" stroke-width="1.6"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke="#F2F4F7" stroke-width="1.6"/></svg>
      </button>
    </div>
    <button class="share-btn" id="share-btn" data-i18n="ref_share_btn">Поделиться</button>
  </div>

  <p class="section-title" style="margin-top:18px" data-i18n="ref_how">Как это работает</p>
  <div class="steps">
    <div class="step-row"><div class="step-num">1</div><div class="step-text" data-i18n="ref_step1">Приглашаете друга по <b>реферальной ссылке</b></div></div>
    <div class="step-row"><div class="step-num">2</div><div class="step-text" data-i18n="ref_step2">Друг оформляет <b>подписку Seno</b></div></div>
    <div class="step-row"><div class="step-num">3</div><div class="step-text" id="step3-text">Вы получаете <b id="reward-pct">40%</b> с каждой его оплаты, включая продления</div></div>
  </div>

  <div class="payout-progress">
    <div class="pp-label"><span class="l1" data-i18n="ref_condition">Условие для вывода</span><span class="l2" id="pp-fraction">— из —</span></div>
    <div class="pp-track"><div class="pp-fill" id="pp-fill" style="width:0%;background:var(--down)"></div></div>
    <p class="pp-note" id="pp-note"></p>
  </div>

  <p class="section-title" data-i18n="ref_invited_title">Приглашённые</p>
  <div class="invited-list" id="invited-list"><p class="empty-hint" data-i18n="loading">Загрузка…</p></div>

  <button id="fallback-main-button" data-i18n="ref_payout_btn">Запросить выплату</button>
</div>

<script>
  if (tg) { tg.BackButton.show(); tg.BackButton.onClick(function () { goTo('02-main-menu.html'); }); }
  document.getElementById('back').addEventListener('click', function () { haptic('light'); goTo('02-main-menu.html'); });

  let refLink = '';
  const fallbackBtn = document.getElementById('fallback-main-button');

  function initials(name) {
    if (!name) return '?';
    return name.slice(0, 2).toUpperCase();
  }

  async function requestPayout() {
    haptic('medium');
    const r = await apiFetch('/api/referral/payout', { method: 'POST', body: '{}' });
    if (r.data && r.data.ok) {
      notify('success');
      alert(r.data.message);
      load();
    } else {
      notify('error');
      alert((r.data && r.data.message) || t('ref_payout_failed'));
    }
  }

  function setMainButton(enabled) {
    if (tg) {
      tg.MainButton.setParams({ text: t('ref_payout_btn'), color: enabled ? '#00E5C7' : '#131318', text_color: enabled ? '#04342C' : '#5A5F6B' });
      tg.MainButton.show();
      tg.MainButton.offClick(requestPayout);
      if (enabled) tg.MainButton.onClick(requestPayout);
      fallbackBtn.style.display = 'none';
    } else {
      fallbackBtn.style.display = 'flex';
      fallbackBtn.className = enabled ? '' : 'disabled';
      fallbackBtn.onclick = enabled ? requestPayout : null;
    }
  }

  async function load() {
    const r = await apiFetch('/api/referral/stats');
    if (!r.ok || !r.data) {
      document.getElementById('invited-list').innerHTML = '<p class="empty-hint">' + t('ref_load_error') + '</p>';
      setMainButton(false);
      return;
    }
    const d = r.data;
    refLink = d.link;
    document.getElementById('ref-link').textContent = d.link.replace('https://', '');
    document.getElementById('hero-amount').textContent = fmtUsd(d.total_earned_usd);
    document.getElementById('c-invited').textContent = d.invited;
    document.getElementById('c-paid').textContent = d.paid_referrals;
    document.getElementById('c-available').textContent = fmtUsd(d.available_usd);
    document.getElementById('pp-fraction').textContent = t('ref_of', { a: d.paid_referrals, b: d.min_paid_referrals });
    document.getElementById('step3-text').innerHTML = t('ref_step3', { pct: '<b id="reward-pct">' + d.reward_percent + '%</b>' });

    const pct = Math.min(100, (d.paid_referrals / d.min_paid_referrals) * 100);
    const fill = document.getElementById('pp-fill');
    fill.style.width = pct + '%';
    fill.style.background = d.can_request_payout ? 'var(--up)' : 'var(--warn)';

    document.getElementById('pp-note').textContent = d.can_request_payout
      ? t('ref_note_ok', { n: d.min_paid_referrals })
      : t('ref_note_pending', { left: Math.max(0, d.min_paid_referrals - d.paid_referrals), min: d.min_payout_usd.toFixed(0) });

    const listEl = document.getElementById('invited-list');
    if (!d.invited_list.length) {
      listEl.innerHTML = '<p class="empty-hint">' + t('ref_invited_empty') + '</p>';
    } else {
      listEl.innerHTML = d.invited_list.map(function (u) {
        const name = u.first_name || u.username || ('ID ' + u.telegram_id);
        return '<div class="invited-row"><div class="inv-avatar">' + initials(name) + '</div>' +
          '<div class="inv-info"><div class="inv-name">' + name + '</div><div class="inv-date">' + dateRu(u.created_at) + '</div></div>' +
          '<div class="inv-right"><div class="inv-status ' + (u.paid ? 'paid' : 'unpaid') + '">' + (u.paid ? t('ref_paid_status') : t('ref_unpaid_status')) + '</div>' +
          '<div class="inv-amount">' + (u.paid ? fmtUsd(u.reward_usd) : '—') + '</div></div></div>';
      }).join('');
    }

    setMainButton(d.can_request_payout);
  }

  document.getElementById('copy-btn').addEventListener('click', function () {
    const btn = this;
    haptic('light');
    const done = function () {
      btn.classList.add('copied');
      setTimeout(function () { btn.classList.remove('copied'); }, 1200);
    };
    if (navigator.clipboard && refLink) { navigator.clipboard.writeText(refLink).then(done).catch(done); }
    else { done(); }
  });

  document.getElementById('share-btn').addEventListener('click', function () {
    haptic('light');
    if (!refLink) return;
    const shareUrl = 'https://t.me/share/url?url=' + encodeURIComponent(refLink) + '&text=' + encodeURIComponent(t('ref_share_text'));
    if (tg && tg.openTelegramLink) { tg.openTelegramLink(shareUrl); } else { window.open(shareUrl, '_blank'); }
  });

  load();
</script>
</body>
</html>
