<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Seno — Факторы анализа</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="locales.js?v=fdecc66a"></script>
<script src="shared.js?v=2a001283"></script>
<style>
  :root {
    --bg: #000000; --surface: #0B0B0E; --surface-raised: #131318; --border: #1E1E24;
    --text-primary: #F2F4F7; --text-secondary: #8A8F9C; --text-tertiary: #5A5F6B;
    --accent: #00E5C7; --up: #1FCF6C; --down: #F6465D;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Roboto, sans-serif;
    --font-mono: "SF Mono", "SFMono-Regular", Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text-primary); font-family: var(--font); }
  body { display: flex; justify-content: center; }
  .app-shell { width: 100%; max-width: 420px; min-height: 100vh; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }

  .subtitle { font-size: 12.5px; color: var(--text-tertiary); margin: -8px 0 16px 2px; }

  .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 14px; min-height: 84px; }
  .summary-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .summary-dir { font-size: 20px; font-weight: 700; }
  .summary-conf { font-family: var(--font-mono); font-size: 13px; color: var(--text-secondary); }
  .summary-line { font-size: 12.5px; color: var(--text-secondary); margin: 0 0 8px; }
  .ratio-bar { height: 6px; border-radius: 3px; overflow: hidden; display: flex; background: var(--surface-raised); }
  .ratio-up { background: var(--up); } .ratio-down { background: var(--down); }

  .cat-filter { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 12px; padding: 0 16px 2px; scrollbar-width: none; }
  .cat-filter::-webkit-scrollbar { display: none; }
  .cat-filter button { flex: none; border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary);
    font-family: var(--font); font-size: 12px; font-weight: 700; padding: 7px 13px; border-radius: 9px; white-space: nowrap; }
  .cat-filter button.active { background: var(--accent); color: #04342C; border-color: var(--accent); }

  .factor-list { display: flex; flex-direction: column; gap: 10px; }
  .factor-card { border: 1px solid var(--border); border-radius: 16px; padding: 14px; background: var(--surface); }
  .factor-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 6px; }

  .factor-weight { flex: none; text-align: right; }
  .factor-weight .wv { font-family: var(--font-mono); font-size: 14px; font-weight: 700; }
  .factor-weight .wv.up { color: var(--up); } .factor-weight .wv.down { color: var(--down); }
  .factor-weight .wl { font-size: 9.5px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 1px; }
  .weight-track { height: 4px; border-radius: 2px; background: var(--surface-raised); overflow: hidden; margin: 8px 0 0; }
  .weight-fill { height: 100%; border-radius: 2px; }
  .weight-fill.up { background: var(--up); } .weight-fill.down { background: var(--down); }
  .factor-cat { font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-tertiary); margin: 0 0 4px; }
  .factor-name-row { display: flex; align-items: center; gap: 7px; }
  .factor-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .factor-dot.up { background: var(--up); } .factor-dot.down { background: var(--down); }
  .factor-name { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
  .factor-desc { font-size: 12.5px; color: var(--text-secondary); line-height: 1.45; margin: 0; }

  .lock-card { text-align: center; padding: 22px 18px; margin-top: 6px; background: var(--surface); border: 1px solid var(--accent); border-radius: 16px; }
  .lock-card p { font-size: 12.5px; color: var(--text-secondary); margin: 0 0 12px; line-height: 1.4; }
  .lock-btn { font-size: 13px; font-weight: 700; color: #04342C; background: var(--accent); border: none; padding: 10px 18px; border-radius: 12px; }

  .skeleton { height: 90px; border-radius: 16px; background: linear-gradient(90deg, var(--surface) 25%, var(--surface-raised) 37%, var(--surface) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease-in-out infinite; margin-bottom: 10px; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
</style>
</head>
<body>
<div class="app-shell">

  <div id="app-header"></div>
  <p class="subtitle" id="subtitle"></p>

  <div id="skeleton">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>

  <p id="load-error" style="display:none;color:var(--text-tertiary);font-size:13px;padding:20px 2px;text-align:center"></p>

  <div id="content" style="display:none">
    <div class="summary-card">
      <div class="summary-top"><span class="summary-dir" id="summary-dir">—</span><span class="summary-conf" id="summary-conf"></span></div>
      <p class="summary-line" id="summary-line"></p>
      <div class="ratio-bar"><div class="ratio-up" id="ratio-up" style="width:50%"></div><div class="ratio-down" id="ratio-down" style="width:50%"></div></div>
    </div>

    <div class="cat-filter" id="cat-filter"></div>
    <div class="factor-list" id="factor-list"></div>

    <div class="lock-card" id="lock-card" style="display:none">
      <p data-i18n="fa_lock_text">Полный разбор всех факторов доступен по подписке.</p>
      <button class="lock-btn" id="lock-btn" data-i18n="fa_lock_btn">Оформить подписку — $59/мес</button>
    </div>
  </div>

</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const symbol = params.get('symbol') || 'BTC/USDT';
  const timeframe = params.get('timeframe') || '4h';
  const backHref = '04-analysis.html?' + qs({ symbol, timeframe });

  renderHeader({ title: t('fa_word'), showBack: true, backHref: backHref });
  document.getElementById('subtitle').textContent = symbol + ' · ' + timeframe;

  let allFactors = [];
  let activeCat = '__all__';

  async function load() {
    const r = await apiFetch('/api/analysis/factors?' + qs({ symbol, timeframe }));
    document.getElementById('skeleton').style.display = 'none';

    if (r.status === 402) {
      document.getElementById('content').style.display = 'block';
      document.getElementById('summary-line').textContent = t('fa_lock_text');
      document.getElementById('lock-card').style.display = 'block';
      return;
    }
    if (!r.ok || !r.data) {
      // Не перезаписываем #content целиком: это снесло бы фильтр и список,
      // и экран уже не смог бы отрисоваться без перезагрузки страницы.
      const err = document.getElementById('load-error');
      err.textContent = t('fa_load_error');
      err.style.display = 'block';
      return;
    }

    const data = r.data;
    document.getElementById('content').style.display = 'block';
    document.getElementById('summary-dir').textContent = data.signal === 'BUY' ? t('fa_long') : data.signal === 'SELL' ? t('fa_short') : t('fa_neutral');
    document.getElementById('summary-dir').style.color = data.signal === 'BUY' ? '#1FCF6C' : data.signal === 'SELL' ? '#F6465D' : '#8A8F9C';
    document.getElementById('summary-conf').textContent = t('an_conf_label') + ' ' + data.confidence + '%';
    document.getElementById('summary-line').innerHTML = t('fa_summary', {
      total: '<b>' + data.total + '</b>',
      up: '<b style="color:#1FCF6C">' + data.up_count + ' ' + t('fa_up_word') + '</b>',
      down: '<b style="color:#F6465D">' + data.down_count + ' ' + t('fa_down_word') + '</b>',
    });
    const total = Math.max(1, data.total);
    document.getElementById('ratio-up').style.width = (data.up_count / total * 100) + '%';
    document.getElementById('ratio-down').style.width = (data.down_count / total * 100) + '%';

    allFactors = data.factors;
    renderFilter();
    renderFactors();

    if (data.locked) {
      document.getElementById('lock-card').style.display = 'block';
    }
  }

  function renderFilter() {
    // Категории берём из самих данных: ядро может добавить новую,
    // и хардкод списка тут же начал бы её прятать.
    const cats = [];
    allFactors.forEach(function (f) { if (cats.indexOf(f.cat) === -1) cats.push(f.cat); });
    const el = document.getElementById('cat-filter');
    if (cats.length < 2) { el.style.display = 'none'; return; }
    el.style.display = 'flex';
    el.innerHTML = ['__all__'].concat(cats).map(function (c) {
      const label = c === '__all__' ? t('fa_filter_all') : c;
      return '<button type="button" class="' + (c === activeCat ? 'active' : '') + '" data-cat="' + c + '">' + label + '</button>';
    }).join('');
    el.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () {
        haptic('light');
        activeCat = b.getAttribute('data-cat');
        renderFilter();
        renderFactors();
      });
    });
  }

  function renderFactors() {
    const shown = activeCat === '__all__'
      ? allFactors
      : allFactors.filter(function (f) { return f.cat === activeCat; });

    const listEl = document.getElementById('factor-list');
    if (!shown.length) {
      listEl.innerHTML = '<p style="color:var(--text-tertiary);font-size:12.5px;padding:10px 2px">' + t('fa_empty_filter') + '</p>';
      return;
    }

    // Вклад показываем долей от суммы весов: абсолютный weight из ядра
    // измеряется в разных единицах у разных факторов (сила тренда, отклонение
    // RSI, нормированная гистограмма MACD) и сам по себе несопоставим.
    const total = shown.reduce(function (s, f) { return s + (Number(f.weight) || 0); }, 0) || 1;

    listEl.innerHTML = shown.map(function (f) {
      const dir = f.dir === 'UP' ? 'up' : 'down';
      const share = Math.round((Number(f.weight) || 0) / total * 100);
      return '<div class="factor-card">' +
        '<div class="factor-top">' +
        '<div><p class="factor-cat">' + f.cat + '</p>' +
        '<div class="factor-name-row"><div class="factor-dot ' + dir + '"></div><span class="factor-name">' + f.name + '</span></div></div>' +
        '<div class="factor-weight"><div class="wv ' + dir + '">' + share + '%</div>' +
        '<div class="wl">' + t('fa_contribution') + '</div></div>' +
        '</div>' +
        '<p class="factor-desc">' + f.desc + '</p>' +
        '<div class="weight-track"><div class="weight-fill ' + dir + '" style="width:' + Math.max(2, share) + '%"></div></div>' +
        '</div>';
    }).join('');
  }

  document.getElementById('lock-btn').addEventListener('click', function () { haptic('light'); goTo('06-subscription.html'); });

  load();
</script>
</body>
</html>
