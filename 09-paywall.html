<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Seno — Доступ по подписке</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="shared.js"></script>
<style>
  :root {
    --bg: #000000; --surface: #0B0B0E; --surface-raised: #131318; --border: #1E1E24;
    --text-primary: #F2F4F7; --text-secondary: #8A8F9C; --text-tertiary: #5A5F6B;
    --accent: #00E5C7; --up: #1FCF6C; --down: #F6465D; --warn: #F0B90B;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Roboto, sans-serif;
    --font-mono: "SF Mono", "SFMono-Regular", Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text-primary); font-family: var(--font); }
  body { display: flex; justify-content: center; }
  .app-shell { width: 100%; max-width: 420px; min-height: 100vh; position: relative; }

  .bg-content { padding: 16px; filter: blur(7px) brightness(0.5); pointer-events: none; user-select: none; }
  .bg-header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .bg-header svg { width: 24px; height: 24px; }
  .bg-header .word { font-size: 15px; font-weight: 700; color: var(--text-secondary); }
  .bg-header h1 { font-size: 17px; font-weight: 700; margin: 0 0 0 4px; }

  .bg-segment { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
  .bg-segment span { flex: 1; text-align: center; font-size: 12.5px; font-weight: 700; padding: 9px 4px; border-radius: 9px; color: var(--text-secondary); }
  .bg-segment span.active { background: var(--accent); color: #04342C; }

  .bg-row { display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--up); border-radius: 0 14px 14px 0; margin-bottom: 8px; }
  .bg-row.down { border-left-color: var(--down); }
  .bg-row .tk { flex: 1; font-size: 14.5px; font-weight: 700; }
  .bg-row .pr { flex: none; font-family: var(--font-mono); font-size: 13px; color: var(--text-secondary); }
  .bg-row .pill { flex: none; margin-left: 12px; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 8px; background: var(--up); color: #04342C; }
  .bg-row.down .pill { background: var(--down); color: #4A1013; }

  .overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.55); padding: 20px;
  }

  .lock-card {
    width: 100%; max-width: 340px; background: var(--surface); border: 1px solid var(--accent);
    border-radius: 20px; padding: 26px 22px; text-align: center;
    box-shadow: 0 0 34px rgba(0, 229, 199, 0.2);
  }

  .lock-icon { width: 44px; height: 44px; margin: 0 auto 16px; }
  .lock-title { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 8px; }
  .lock-text { font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; margin: 0 0 16px; }
  .lock-price { font-family: var(--font-mono); font-size: 22px; font-weight: 700; margin-bottom: 18px; }
  .lock-price span { font-size: 12px; color: var(--text-secondary); font-family: var(--font); font-weight: 400; }

  .lock-primary {
    display: block; width: 100%; padding: 13px; border-radius: 12px; background: var(--accent); color: #04342C;
    font-family: var(--font); font-size: 14.5px; font-weight: 700; border: none; margin-bottom: 10px;
  }
  .lock-primary:active { transform: scale(0.98); }

  .lock-secondary {
    display: block; width: 100%; padding: 12px; border-radius: 12px; background: transparent; color: var(--text-secondary);
    font-family: var(--font); font-size: 13px; font-weight: 700; border: 1px solid var(--border);
  }
  .lock-secondary:active { opacity: 0.75; }
</style>
</head>
<body>
<div class="app-shell">

  <div class="bg-content">
    <div class="bg-header">
      <svg viewBox="0 0 48 48" fill="none"><rect x="1" y="1" width="46" height="46" rx="13" fill="#0B0B0E" stroke="#1E1E24" stroke-width="1.5"/><path d="M11 30L19 22L25 27L37 14" stroke="#00E5C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="37" cy="14" r="3" fill="#00E5C7"/></svg>
      <span class="word">Seno</span>
      <h1>Скринер</h1>
    </div>
    <div class="bg-segment"><span class="active">Скальпинг</span><span>Дневная</span><span>Долгосрочная</span></div>
    <div class="bg-row"><span class="tk">BTC</span><span class="pr">$64 512</span><span class="pill">BUY 87%</span></div>
    <div class="bg-row down"><span class="tk">SOL</span><span class="pr">$146.80</span><span class="pill">SELL 68%</span></div>
    <div class="bg-row"><span class="tk">DOGE</span><span class="pr">$0.1187</span><span class="pill">BUY 58%</span></div>
    <div class="bg-row down"><span class="tk">ARB</span><span class="pr">$0.6120</span><span class="pill">SELL 62%</span></div>
    <div class="bg-row"><span class="tk">XRP</span><span class="pr">$0.5834</span><span class="pill">BUY 61%</span></div>
  </div>

  <div class="overlay">
    <div class="lock-card">
      <svg class="lock-icon" viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="10" rx="2.5" stroke="#00E5C7" stroke-width="1.7"/><path d="M8 10V7.5A4 4 0 0 1 16 7.5V10" stroke="#00E5C7" stroke-width="1.7"/><circle cx="12" cy="15" r="1.6" fill="#00E5C7"/></svg>
      <p class="lock-title" data-i18n="pw_title">Доступно по подписке Seno</p>
      <p class="lock-text" data-i18n="pw_text">Скринер и анализ монет открываются с активной подпиской</p>
      <div class="lock-price">$59<span data-i18n="pw_price_period"> / мес</span></div>
      <button class="lock-primary" id="sub-btn" data-i18n="pw_btn">Оформить подписку</button>
    </div>
  </div>

</div>

<script>
  if (tg) { tg.BackButton.show(); tg.BackButton.onClick(function () { goTo('02-main-menu.html'); }); }

  document.getElementById('sub-btn').addEventListener('click', function () {
    haptic('light');
    goTo('06-subscription.html');
  });
</script>
</body>
</html>
