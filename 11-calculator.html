<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Seno — Размер позиции</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="locales.js?v=c99b80b4"></script>
<script src="shared.js?v=2a001283"></script>
<style>
  :root {
    --bg: #000000; --surface: #0B0B0E; --surface-raised: #131318; --border: #1E1E24;
    --text-primary: #F2F4F7; --text-secondary: #8A8F9C; --text-tertiary: #5A5F6B;
    --accent: #00E5C7; --up: #1FCF6C; --down: #F6465D; --warn: #F0B90B;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Roboto, sans-serif;
    --font-mono: "SF Mono", "SFMono-Regular", Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text-primary); font-family: var(--font); }
  body { display: flex; justify-content: center; }
  .app-shell { width: 100%; max-width: 420px; min-height: 100vh; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }

  .hint { font-size: 12px; color: var(--text-tertiary); line-height: 1.5; margin: 0 0 16px 2px; }
  .prefill { font-size: 11.5px; color: var(--accent); margin: 0 0 14px 2px; }

  .form { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 4px 14px; margin-bottom: 14px; }
  .field { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .field:last-child { border-bottom: none; }
  .field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .input-wrap { display: flex; align-items: center; gap: 8px; }
  .input-wrap input {
    flex: 1; min-width: 0; background: var(--surface-raised); border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 12px; color: var(--text-primary); font-family: var(--font-mono); font-size: 15px; font-weight: 700;
  }
  .input-wrap input:focus { outline: none; border-color: var(--accent); }
  .input-wrap .unit { flex: none; font-size: 13px; color: var(--text-tertiary); font-family: var(--font-mono); }

  .risk-presets { display: flex; gap: 6px; margin-top: 8px; }
  .risk-presets button { flex: 1; border: 1px solid var(--border); background: var(--surface-raised); color: var(--text-secondary);
    font-family: var(--font-mono); font-size: 12px; font-weight: 700; padding: 7px 0; border-radius: 9px; }
  .risk-presets button.active { background: var(--accent); color: #04342C; border-color: var(--accent); }

  .result { background: var(--surface); border: 1px solid var(--accent); border-radius: 16px; padding: 4px 16px;
    margin-bottom: 14px; box-shadow: 0 0 24px rgba(0,229,199,0.12); display: none; }
  .res-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .res-row:last-child { border-bottom: none; }
  .res-row .k { font-size: 13px; color: var(--text-secondary); }
  .res-row .v { font-family: var(--font-mono); font-size: 16px; font-weight: 700; }
  .res-row .v.accent { color: var(--accent); }
  .res-row .v.down { color: var(--down); }

  .error { display: none; background: rgba(246,70,93,0.1); border: 1px solid var(--down); border-radius: 12px;
    padding: 12px 14px; font-size: 12.5px; color: var(--down); line-height: 1.45; margin-bottom: 14px; }
  .disclaimer { font-size: 10.5px; color: var(--text-tertiary); text-align: center; line-height: 1.5; padding: 0 10px; margin-bottom: 100px; }
</style>
</head>
<body>
<div class="app-shell">

  <div id="app-header"></div>
  <p class="hint" data-i18n="calc_hint">Укажите депозит и долю, которой готовы рискнуть.</p>
  <p class="prefill" id="prefill" style="display:none"></p>

  <div class="error" id="error"></div>

  <div class="form">
    <div class="field">
      <label data-i18n="calc_deposit">Депозит</label>
      <div class="input-wrap"><input type="text" inputmode="decimal" id="deposit" value="1000"><span class="unit">USDT</span></div>
    </div>
    <div class="field">
      <label data-i18n="calc_risk_pct">Риск на сделку</label>
      <div class="input-wrap"><input type="text" inputmode="decimal" id="risk" value="1"><span class="unit">%</span></div>
      <div class="risk-presets" id="risk-presets">
        <button type="button" data-v="0.5">0.5%</button>
        <button type="button" data-v="1">1%</button>
        <button type="button" data-v="2">2%</button>
        <button type="button" data-v="3">3%</button>
      </div>
    </div>
    <div class="field">
      <label data-i18n="calc_entry">Цена входа</label>
      <div class="input-wrap"><input type="text" inputmode="decimal" id="entry" placeholder="0"><span class="unit">$</span></div>
    </div>
    <div class="field">
      <label data-i18n="calc_stop">Стоп-лосс</label>
      <div class="input-wrap"><input type="text" inputmode="decimal" id="stop" placeholder="0"><span class="unit">$</span></div>
    </div>
  </div>

  <div class="result" id="result">
    <div class="res-row"><span class="k" data-i18n="calc_result_size">Размер позиции</span><span class="v accent" id="r-size">—</span></div>
    <div class="res-row"><span class="k" data-i18n="calc_result_qty">Количество</span><span class="v" id="r-qty">—</span></div>
    <div class="res-row"><span class="k" data-i18n="calc_result_risk">Вы рискуете</span><span class="v down" id="r-risk">—</span></div>
    <div class="res-row"><span class="k" data-i18n="calc_result_loss">Убыток по стопу</span><span class="v down" id="r-loss">—</span></div>
  </div>

  <p class="disclaimer" data-i18n="an_disclaimer">⚠️ Не является инвестиционной рекомендацией</p>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  renderHeader({ title: t('calc_word'), showBack: true, backHref: '02-main-menu.html' });

  const $ = function (id) { return document.getElementById(id); };

  // Подстановка из анализа монеты: вход и стоп уже посчитаны там,
  // руками их переписывать не нужно.
  if (params.get('entry')) $('entry').value = params.get('entry');
  if (params.get('stop')) $('stop').value = params.get('stop');
  if (params.get('symbol')) {
    $('prefill').textContent = t('calc_prefill', { symbol: params.get('symbol') });
    $('prefill').style.display = 'block';
  }

  function num(id) {
    // Запятая как десятичный разделитель — привычна для русской раскладки
    const raw = ($(id).value || '').replace(',', '.').replace(/\s/g, '');
    const v = parseFloat(raw);
    return isFinite(v) ? v : NaN;
  }

  function calculate() {
    const deposit = num('deposit'), riskPct = num('risk');
    const entry = num('entry'), stop = num('stop');

    const invalid = !(deposit > 0) || !(riskPct > 0) || !(entry > 0) || !(stop > 0) || entry === stop;
    if (invalid) {
      $('result').style.display = 'none';
      // Пустые поля — это не ошибка, а ещё не заполненная форма:
      // ругаться на пользователя до ввода данных незачем.
      const touched = $('entry').value.trim() !== '' && $('stop').value.trim() !== '';
      $('error').style.display = touched ? 'block' : 'none';
      $('error').textContent = t('calc_invalid');
      return;
    }
    $('error').style.display = 'none';

    const riskAmount = deposit * riskPct / 100;
    const perUnitRisk = Math.abs(entry - stop);
    const qty = riskAmount / perUnitRisk;
    const notional = qty * entry;

    $('r-size').textContent = fmtUsd(notional);
    $('r-qty').textContent = qty >= 1 ? qty.toFixed(4) : qty.toFixed(8);
    $('r-risk').textContent = fmtUsd(riskAmount) + ' · ' + riskPct + '%';
    $('r-loss').textContent = '−' + fmtUsd(riskAmount);
    $('result').style.display = 'block';
  }

  ['deposit', 'risk', 'entry', 'stop'].forEach(function (id) {
    $(id).addEventListener('input', function () {
      if (id === 'risk') syncPresets();
      calculate();
    });
  });

  function syncPresets() {
    const v = num('risk');
    document.querySelectorAll('#risk-presets button').forEach(function (b) {
      b.classList.toggle('active', parseFloat(b.getAttribute('data-v')) === v);
    });
  }

  document.querySelectorAll('#risk-presets button').forEach(function (b) {
    b.addEventListener('click', function () {
      haptic('light');
      $('risk').value = b.getAttribute('data-v');
      syncPresets();
      calculate();
    });
  });

  syncPresets();
  calculate();
</script>
</body>
</html>
