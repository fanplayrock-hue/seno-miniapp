<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Seno — Главное меню</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="shared.js"></script>
<style>
  :root {
    --bg: #000000;
    --surface: #0B0B0E;
    --surface-raised: #131318;
    --border: #1E1E24;
    --text-primary: #F2F4F7;
    --text-secondary: #8A8F9C;
    --text-tertiary: #5A5F6B;
    --accent: #00E5C7;
    --up: #1FCF6C;
    --down: #F6465D;
    --warn: #F0B90B;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Roboto, sans-serif;
    --font-mono: "SF Mono", "SFMono-Regular", Consolas, monospace;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font);
  }

  body { display: flex; justify-content: center; }

  .app-shell {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .logo { display: flex; align-items: center; gap: 8px; }
  .logo svg { width: 26px; height: 26px; }
  .logo span { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }

  .user-block { display: flex; align-items: center; gap: 8px; }

  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-secondary);
  }

  .sub-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 8px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    white-space: nowrap;
  }

  .sub-badge.active { color: #04342C; background: var(--up); border-color: var(--up); }
  .sub-badge.warn { color: #412402; background: var(--warn); border-color: var(--warn); }

  .section-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    margin: 0 0 10px 2px;
  }

  .market-card {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 20px;
    gap: 18px;
    min-height: 66px;
  }

  .market-item { flex: 1; min-width: 0; }
  .market-label { font-size: 11px; color: var(--text-secondary); margin: 0 0 6px; }

  .fng-row { display: flex; align-items: baseline; gap: 6px; margin-bottom: 6px; }
  .fng-value { font-family: var(--font-mono); font-size: 20px; font-weight: 700; }
  .fng-class { font-size: 12px; color: var(--warn); font-weight: 700; }

  .fng-scale {
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(90deg, #F6465D, #F0B90B, #1FCF6C);
    position: relative;
  }

  .fng-marker {
    position: absolute;
    top: -3px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--text-primary);
    border: 2px solid #000;
    transform: translateX(-50%);
  }

  .dom-value { font-family: var(--font-mono); font-size: 20px; font-weight: 700; }
  .dom-sub { font-size: 11px; color: var(--text-secondary); margin-top: 6px; }

  .divider-v { width: 1px; background: var(--border); flex: none; }

  .signals-scroll {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin: 0 -16px 20px;
    padding-left: 16px;
    padding-right: 16px;
    scroll-snap-type: x proximity;
    min-height: 84px;
  }

  .signals-scroll::-webkit-scrollbar { display: none; }

  .signal-card {
    flex: none;
    scroll-snap-align: start;
    width: 118px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
  }

  .signal-card .tk { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .signal-card .pr { font-family: var(--font-mono); font-size: 12.5px; color: var(--text-secondary); margin-bottom: 10px; }

  .dir-pill {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 7px;
  }

  .dir-pill.buy { background: var(--up); color: #04342C; }
  .dir-pill.sell { background: var(--down); color: #4A1013; }
  .dir-pill.wait { background: var(--surface-raised); color: var(--text-secondary); border: 1px solid var(--border); }

  .empty-hint { font-size: 12.5px; color: var(--text-tertiary); padding: 12px 2px; }

  .grid-2x2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
  }

  .section-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    min-height: 96px;
  }

  .section-card:active { transform: scale(0.97); opacity: 0.9; }

  .section-icon {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: var(--surface-raised);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .section-icon svg { width: 17px; height: 17px; }

  .section-card .st { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 2px; }
  .section-card .sd { font-size: 11.5px; color: var(--text-secondary); margin: 0; line-height: 1.35; }

  .updated-at {
    text-align: center;
    font-size: 11px;
    color: var(--text-tertiary);
  }

  .skeleton {
    background: linear-gradient(90deg, var(--surface) 25%, var(--surface-raised) 37%, var(--surface) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease-in-out infinite;
    border-radius: 10px;
  }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
</style>
</head>
<body>
<div class="app-shell">

  <header>
    <div class="logo">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="46" height="46" rx="13" fill="#0B0B0E" stroke="#1E1E24" stroke-width="1.5"/>
        <path d="M11 30L19 22L25 27L37 14" stroke="#00E5C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="37" cy="14" r="3" fill="#00E5C7"/>
      </svg>
      <span>Seno</span>
    </div>
    <div class="user-block">
      <span class="sub-badge" id="sub-badge">…</span>
      <div class="avatar" id="avatar">–</div>
    </div>
  </header>

  <div class="market-card" id="market-card">
    <div class="market-item"><div class="skeleton" style="height:40px"></div></div>
    <div class="market-item"><div class="skeleton" style="height:40px"></div></div>
  </div>

  <p class="section-title" data-i18n="menu_signals">Сигналы сейчас</p>
  <div class="signals-scroll" id="signals-scroll">
    <div class="signal-card"><div class="skeleton" style="height:60px"></div></div>
    <div class="signal-card"><div class="skeleton" style="height:60px"></div></div>
    <div class="signal-card"><div class="skeleton" style="height:60px"></div></div>
  </div>

  <p class="section-title" data-i18n="menu_sections">Разделы</p>
  <div class="grid-2x2">
    <div class="section-card" data-nav="03-screener.html">
      <div class="section-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="10.5" cy="10.5" r="6" stroke="#00E5C7" stroke-width="1.6"/>
          <path d="M20 20L15.5 15.5" stroke="#00E5C7" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <p class="st" data-i18n="menu_screener_t">Скринер</p>
        <p class="sd" data-i18n="menu_screener_d">Поиск сетапов по рынку</p>
      </div>
    </div>

    <div class="section-card" data-nav="04-analysis.html">
      <div class="section-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 19L9 12L13 15L20 6" stroke="#00E5C7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 19H20" stroke="#00E5C7" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <p class="st" data-i18n="menu_analysis_t">Анализ</p>
        <p class="sd" data-i18n="menu_analysis_d">Разбор конкретной монеты</p>
      </div>
    </div>

    <div class="section-card" data-nav="07-referral.html">
      <div class="section-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="9" cy="9" r="3" stroke="#00E5C7" stroke-width="1.6"/>
          <circle cx="17" cy="12" r="2.4" stroke="#00E5C7" stroke-width="1.6"/>
          <path d="M4 19C4 15.5 6.5 14 9 14C11.5 14 13.6 15.3 14 18" stroke="#00E5C7" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M14.5 17.5C14.9 15.8 16 15 17.3 15C19 15 20 16.2 20 18.5" stroke="#00E5C7" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <p class="st" data-i18n="menu_referral_t">Рефералы</p>
        <p class="sd" data-i18n="menu_referral_d">40% с каждого приглашённого</p>
      </div>
    </div>

    <div class="section-card" data-nav="06-subscription.html">
      <div class="section-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3L20 7.5V16.5L12 21L4 16.5V7.5L12 3Z" stroke="#00E5C7" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M9 12L11 14L15.5 9.5" stroke="#00E5C7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <p class="st" data-i18n="menu_subscription_t">Подписка</p>
        <p class="sd" data-i18n="menu_subscription_d">Управление доступом</p>
      </div>
    </div>
  </div>

  <p class="updated-at" id="updated-at"></p>
</div>

<script>
  if (tg) { tg.MainButton.hide(); tg.BackButton.hide(); }

  document.querySelectorAll('[data-nav]').forEach(function (el) {
    el.addEventListener('click', function () {
      haptic('light');
      goTo(el.getAttribute('data-nav'));
    });
  });

  async function loadMe() {
    const r = await apiFetch('/api/me');
    const badge = document.getElementById('sub-badge');
    const avatar = document.getElementById('avatar');
    if (!r.ok || !r.data) {
      badge.textContent = t('menu_guest');
      return;
    }
    const me = r.data;
    avatar.textContent = (me.first_name || '?').slice(0, 1).toUpperCase();
    if (me.subscription.active) {
      const days = Math.max(0, Math.ceil((new Date(me.subscription.expires_at) - new Date()) / 86400000));
      badge.textContent = t('menu_sub_active', { n: days });
      badge.className = 'sub-badge ' + (days <= 3 ? 'warn' : 'active');
    } else {
      badge.textContent = t('menu_sub_none');
      badge.className = 'sub-badge';
    }
  }

  async function loadMarketContext() {
    const r = await apiFetch('/api/market-context');
    const el = document.getElementById('market-card');
    if (!r.ok || !r.data) {
      el.innerHTML = '<p class="empty-hint">' + t('menu_load_error') + '</p>';
      return;
    }
    const fg = r.data.fear_greed;
    const dom = r.data.btc_dominance;
    el.innerHTML =
      '<div class="market-item"><p class="market-label">' + t('menu_fng') + '</p>' +
      (fg
        ? '<div class="fng-row"><span class="fng-value">' + fg.value + '</span><span class="fng-class">' + fg.classification + '</span></div>' +
          '<div class="fng-scale"><div class="fng-marker" style="left:' + fg.value + '%"></div></div>'
        : '<p class="empty-hint">—</p>') +
      '</div><div class="divider-v"></div>' +
      '<div class="market-item"><p class="market-label">' + t('menu_dom') + '</p>' +
      '<div class="dom-value">' + (dom !== null ? dom + '%' : '—') + '</div></div>';
  }

  async function loadSignals() {
    const r = await apiFetch('/api/screener?category=scalping');
    const el = document.getElementById('signals-scroll');
    if (!r.ok || !r.data || !r.data.rows.length) {
      el.innerHTML = '<p class="empty-hint">' + t('menu_empty_signals') + '</p>';
      return;
    }
    el.innerHTML = r.data.rows.slice(0, 4).map(function (row) {
      const cls = row.signal === 'BUY' ? 'buy' : row.signal === 'SELL' ? 'sell' : 'wait';
      return '<div class="signal-card" data-symbol="' + row.full_symbol + '" data-tf="' + r.data.timeframe + '">' +
        '<div class="tk">' + row.symbol + '</div>' +
        '<div class="pr">$' + fmtPrice(row.price) + '</div>' +
        '<span class="dir-pill ' + cls + '">' + row.signal + ' ' + row.confidence + '%</span>' +
        '</div>';
    }).join('');
    el.querySelectorAll('.signal-card').forEach(function (card) {
      card.addEventListener('click', function () {
        haptic('light');
        goTo('04-analysis.html?' + qs({ symbol: card.getAttribute('data-symbol'), timeframe: card.getAttribute('data-tf') }));
      });
    });
  }

  loadMe();
  loadMarketContext();
  loadSignals();
  document.getElementById('updated-at').textContent = t('menu_updated');
</script>
</body>
</html>
