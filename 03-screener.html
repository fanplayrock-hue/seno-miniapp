<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Seno — Скринер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="locales.js?v=c99b80b4"></script>
<script src="shared.js?v=2a001283"></script>
<style>
  :root {
    --bg: #000000; --surface: #0B0B0E; --surface-raised: #131318; --border: #1E1E24;
    --text-primary: #F2F4F7; --text-secondary: #8A8F9C; --text-tertiary: #5A5F6B;
    --accent: #00E5C7; --up: #1FCF6C; --down: #F6465D;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Roboto, sans-serif;
    --font-mono: "SF Mono", "SFMono-Regular", Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text-primary); font-family: var(--font); }
  body { display: flex; justify-content: center; }
  .app-shell { width: 100%; max-width: 420px; min-height: 100vh; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }

  .segment { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
  .segment button { flex: 1; border: none; background: transparent; color: var(--text-secondary); font-family: var(--font);
    font-size: 12.5px; font-weight: 700; padding: 9px 4px; border-radius: 9px; transition: background 0.18s ease-out, color 0.18s ease-out; }
  .segment button.active { background: var(--accent); color: #04342C; }
  .segment button:active { opacity: 0.85; }

  .search-input { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 11px 14px; color: var(--text-primary); font-family: var(--font); font-size: 13.5px; margin-bottom: 10px; }
  .search-input:focus { outline: none; border-color: var(--accent); }

  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; }
  .refresh-btn { flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; margin-left: auto; }
  .refresh-btn svg { width: 17px; height: 17px; transition: transform 0.5s ease-out; }
  .refresh-btn.spinning svg { transform: rotate(360deg); }
  .refresh-btn:active { opacity: 0.8; }
  .cache-note { font-size: 11px; color: var(--text-tertiary); display: flex; align-items: center; }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 10px 14px; background: var(--surface);
    border: 1px solid var(--border); border-left-width: 3px; border-left-style: solid; border-radius: 0 14px 14px 0; }
  .row.wait { opacity: 0.55; }
  .row-ticker { flex: 1; min-width: 0; }
  .row-ticker .tk { font-size: 14.5px; font-weight: 700; }
  .row-ticker .pair { font-size: 11px; color: var(--text-tertiary); margin-top: 1px; }
  .row-price { flex: none; text-align: right; min-width: 78px; }
  .row-price .pr { font-family: var(--font-mono); font-size: 13px; }
  .row-price .ch { font-size: 11px; margin-top: 2px; font-weight: 700; }
  .row-price .ch.up { color: var(--up); }
  .row-price .ch.down { color: var(--down); }
  .row-badge { flex: none; min-width: 68px; text-align: right; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 8px; }
  .pill.buy { background: var(--up); color: #04342C; }
  .pill.sell { background: var(--down); color: #4A1013; }
  .pill.wait { background: var(--surface-raised); color: var(--text-secondary); border: 1px solid var(--border); }

  .skeleton-row { height: 64px; border-radius: 14px; background: linear-gradient(90deg, var(--surface) 25%, var(--surface-raised) 37%, var(--surface) 63%);
    background-size: 400% 100%; animation: shimmer 1.4s ease-in-out infinite; margin-bottom: 8px; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

  .empty-state { display: none; flex-direction: column; align-items: center; text-align: center; padding: 56px 24px; color: var(--text-secondary); }
  .empty-state svg { width: 40px; height: 40px; margin-bottom: 14px; }
  .empty-state p.t { font-size: 14.5px; font-weight: 700; color: var(--text-primary); margin: 0 0 6px; }
  .empty-state p.d { font-size: 12.5px; margin: 0 0 16px; line-height: 1.4; }

  .lock-card { text-align: center; padding: 20px 16px; margin-top: 4px; background: var(--surface); border: 1px solid var(--accent); border-radius: 16px; }
  .lock-card p { font-size: 12.5px; color: var(--text-secondary); margin: 0 0 12px; line-height: 1.4; }
  .lock-btn { font-size: 13px; font-weight: 700; color: #04342C; background: var(--accent); border: none; padding: 10px 18px; border-radius: 12px; }
</style>
</head>
<body>
<div class="app-shell">

  <div id="app-header"></div>

  <div class="segment">
    <button class="active" data-cat="scalping" data-i18n="scr_seg_scalping">Скальпинг</button>
    <button data-cat="swing" data-i18n="scr_seg_swing">Дневная</button>
    <button data-cat="position" data-i18n="scr_seg_position">Долгосрочная</button>
  </div>

  <input class="search-input" id="search" data-i18n-placeholder="scr_search" placeholder="Поиск по тикеру">

  <div class="toolbar">
    <span class="cache-note" id="cache-note"></span>
    <button class="refresh-btn" id="refresh">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 12a8 8 0 1 1-2.34-5.66" stroke="#00E5C7" stroke-width="1.8" stroke-linecap="round"/><path d="M20 4v5h-5" stroke="#00E5C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div id="skeleton">
    <div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div>
    <div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div>
  </div>

  <div class="list" id="list" style="display: none;"></div>
  <div class="lock-card" id="lock-card" style="display: none;">
    <p id="lock-text"></p>
    <button class="lock-btn" id="lock-btn" data-i18n="scr_lock_btn">Оформить подписку</button>
  </div>

  <div class="empty-state" id="empty">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="10.5" cy="10.5" r="6" stroke="#5A5F6B" stroke-width="1.6"/><path d="M20 20L15.5 15.5" stroke="#5A5F6B" stroke-width="1.6" stroke-linecap="round"/><path d="M7.5 13.5L13.5 7.5" stroke="#5A5F6B" stroke-width="1.4" stroke-linecap="round"/></svg>
    <p class="t" data-i18n="scr_empty_t">Сигналов не найдено</p>
    <p class="d" data-i18n="scr_empty_d">Рынок в боковике — попробуйте другую категорию или обновите позже</p>
  </div>

</div>

<script>
  if (tg && tg.BackButton) { try { tg.BackButton.hide(); } catch (e) {} }
  renderHeader({ title: t('scr_title') });
  renderBottomNav('screener');

  const listEl = document.getElementById('list');
  const skeletonEl = document.getElementById('skeleton');
  const emptyEl = document.getElementById('empty');
  const lockCard = document.getElementById('lock-card');
  const cacheNote = document.getElementById('cache-note');
  let currentCat = 'scalping';
  let lastRows = [];
  let lastTimeframe = '';

  /**
   * Фильтрация идёт по уже загруженным строкам, без повторного запроса:
   * скринер отдаёт готовый снимок рынка, и дёргать сервер на каждую
   * набранную букву незачем.
   */
  function applySearch() {
    const q = (document.getElementById('search').value || '').trim().toUpperCase();
    const rows = q ? lastRows.filter(function (r) { return r.symbol.indexOf(q) !== -1; }) : lastRows;

    if (!rows.length) {
      listEl.style.display = 'none';
      emptyEl.style.display = 'flex';
      emptyEl.querySelector('.t').textContent = q ? t('scr_nothing_found', { query: q }) : t('scr_empty_t');
      emptyEl.querySelector('.d').textContent = q ? '' : t('scr_empty_d');
      return;
    }
    emptyEl.style.display = 'none';
    renderRows(rows, lastTimeframe);
    listEl.style.display = 'flex';
  }

  function pillHtml(sig, conf) {
    const cls = sig === 'BUY' ? 'buy' : sig === 'SELL' ? 'sell' : 'wait';
    return '<span class="pill ' + cls + '">' + sig + ' ' + conf + '%</span>';
  }

  function renderRows(rows, timeframe) {
    listEl.innerHTML = rows.map(function (r) {
      const stripe = r.signal === 'BUY' ? 'var(--up)' : r.signal === 'SELL' ? 'var(--down)' : 'var(--border)';
      const changeCls = r.change !== null && r.change >= 0 ? 'up' : 'down';
      const changeTxt = r.change !== null ? (r.change >= 0 ? '▲ ' : '▼ ') + fmtPct(r.change) : '—';
      return '<div class="row' + (r.signal === 'WAIT' ? ' wait' : '') + '" style="border-left-color:' + stripe + '" data-symbol="' + r.full_symbol + '">' +
        '<div class="row-ticker"><div class="tk">' + r.symbol + '</div><div class="pair">' + r.full_symbol + '</div></div>' +
        '<div class="row-price"><div class="pr">$' + fmtPrice(r.price) + '</div><div class="ch ' + changeCls + '">' + changeTxt + '</div></div>' +
        '<div class="row-badge">' + pillHtml(r.signal, r.confidence) + '</div>' +
        '</div>';
    }).join('');
    listEl.querySelectorAll('.row').forEach(function (row) {
      row.addEventListener('click', function () {
        haptic('light');
        goTo('04-analysis.html?' + qs({ symbol: row.getAttribute('data-symbol'), timeframe: timeframe }));
      });
    });
  }

  async function loadCategory(category) {
    currentCat = category;
    listEl.style.display = 'none';
    emptyEl.style.display = 'none';
    lockCard.style.display = 'none';
    skeletonEl.style.display = 'block';

    const r = await apiFetch('/api/screener?' + qs({ category: category }));
    skeletonEl.style.display = 'none';

    if (!r.ok || !r.data) {
      emptyEl.style.display = 'flex';
      return;
    }

    const data = r.data;
    cacheNote.textContent = data.cache_age_seconds !== null ? t('scr_updated_prefix') + ' ' + timeAgoRu(data.cache_age_seconds) : '';

    if (!data.rows.length) {
      emptyEl.style.display = 'flex';
      return;
    }

    lastRows = data.rows;
    lastTimeframe = data.timeframe;
    applySearch();

    if (data.locked) {
      const hidden = data.total - data.rows.length;
      document.getElementById('lock-text').textContent =
        t('scr_lock_text', { shown: data.rows.length, total: data.total, hidden: hidden });
      lockCard.style.display = 'block';
    }
  }

  document.querySelectorAll('.segment button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      haptic('light');
      document.querySelectorAll('.segment button').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      loadCategory(btn.getAttribute('data-cat'));
    });
  });

  document.getElementById('refresh').addEventListener('click', function () {
    const btn = this;
    btn.classList.add('spinning');
    haptic('medium');
    loadCategory(currentCat).then(function () {
      setTimeout(function () { btn.classList.remove('spinning'); }, 500);
    });
  });

  document.getElementById('search').addEventListener('input', applySearch);

  document.getElementById('lock-btn').addEventListener('click', function () {
    haptic('light');
    goTo('06-subscription.html');
  });

  loadCategory('scalping');
</script>
</body>
</html>
